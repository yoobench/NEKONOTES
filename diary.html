<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NekoNotes - My Diary</title>

  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <svg style="display:none">
    <symbol id="paw" viewBox="0 0 24 24">
      <ellipse cx="12" cy="15.5" rx="5.5" ry="4.5"/>
      <ellipse cx="5.5" cy="9" rx="2.5" ry="3"/>
      <ellipse cx="10" cy="5.5" rx="2.5" ry="3"/>
      <ellipse cx="16" cy="5.5" rx="2.5" ry="3"/>
      <ellipse cx="20" cy="9" rx="2.5" ry="3"/>
    </symbol>
  </svg>

  <nav class="game-nav">
    <div class="wrap game-nav-inner">

      <a href="dashboard.html" class="game-brand">
        <svg><use href="#paw"/></svg>
        <span>NekoNotes</span>
      </a>

      <div class="game-nav-links">
        <a href="dashboard.html" class="game-link"><span>🏠</span><small>Home</small></a>
        <a href="diary.html" class="game-link active"><span>📔</span><small>Diary</small></a>
        <a href="tracker.html" class="game-link"><span>✅</span><small>Tasks</small></a>
        <a href="chest.html" class="game-link"><span>🎁</span><small>Chest</small></a>
        <a href="collection.html" class="game-link"><span>🐱</span><small>Cats</small></a>
        <a href="themes.html" class="game-link"><span>🎨</span><small>Themes</small></a>
        <a href="cozy.html" class="game-link"><span>🌙</span><small>Cozy</small></a>
        <a href="achievements.html" class="game-link"><span>🏆</span><small>Achievements</small></a>
      </div>

      <div class="game-paw-counter">
        <svg><use href="#paw"/></svg>
        <span id="pawCount">0</span>
        <small>paws</small>
      </div>

    </div>
  </nav>

  <main class="wrap diary-page">

    <header class="diary-heading">
      <span class="eyebrow">A LITTLE SPACE JUST FOR YOU ✨</span>
      <h1>My Little Diary 📔</h1>
      <p>Write your thoughts, save your memories, and take a moment for yourself.</p>
    </header>

    <section class="diary-editor">
      <div class="diary-editor-heading">
        <h2>Today's Entry</h2>
        <span id="diaryDate"></span>
      </div>

      <input
        type="text"
        id="diaryTitle"
        placeholder="Give your entry a title..."
        maxlength="80"
      >

      <textarea
        id="diaryContent"
        placeholder="What's on your mind today? Start writing here..."
      ></textarea>

      <div class="diary-editor-bottom">
        <span>🐾 Your thoughts are worth saving.</span>
        <button id="saveDiaryBtn" type="button">Save Entry ♡</button>
      </div>

      <p id="diaryMessage" class="diary-message"></p>
    </section>

    <section class="diary-entries-section">
      <div class="diary-entries-heading">
        <h2>My Memories</h2>
        <span id="diaryEntryCount">0 entries</span>
      </div>

      <div id="diaryEntries" class="diary-entries">
        <!-- Saved diary entries will appear here -->
      </div>
    </section>

  </main>

  <script src="theme.js"></script>
  <script src="diary.js"></script>

</body>
</html>
