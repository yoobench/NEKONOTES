<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NekoNotes - Theme Shop</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <svg style="display:none">
    <symbol id="paw" viewBox="0 0 24 24">
      <ellipse cx="12" cy="15.5" rx="5.5" ry="4.5"/>
      <ellipse cx="5.5" cy="9" rx="2.5" ry="3"/>
      <ellipse cx="10" cy="5.5" rx="2.5" ry="3"/>
      <ellipse cx="16" cy="5.5" rx="2.5" ry="3"/>
      <ellipse cx="20" cy="9" rx="2.5" ry="3"/>
    </symbol>
  </svg>

  <nav class="game-nav">
    <div class="wrap game-nav-inner">
      <a href="dashboard.html" class="game-brand">
        <svg><use href="#paw"/></svg>
        <span>NekoNotes</span>
      </a>

      <div class="game-nav-links">
        <a href="dashboard.html" class="game-link"><span>🏠</span><small>Home</small></a>
        <a href="diary.html" class="game-link"><span>📔</span><small>Diary</small></a>
        <a href="tracker.html" class="game-link"><span>✅</span><small>Tasks</small></a>
        <a href="chest.html" class="game-link"><span>🎁</span><small>Chest</small></a>
        <a href="collection.html" class="game-link"><span>🐱</span><small>Cats</small></a>
        <a href="themes.html" class="game-link active"><span>🎨</span><small>Themes</small></a>
        <a href="cozy.html" class="game-link"><span>🌙</span><small>Cozy</small></a>
        <a href="achievements.html" class="game-link"><span>🏆</span><small>Achievements</small></a>
      </div>

      <div class="game-paw-counter">
        <svg><use href="#paw"/></svg>
        <span id="pawCount">0</span>
        <small>paws</small>
      </div>
    </div>
  </nav>

  <main class="wrap themes-page">
    <header class="themes-heading">
      <span class="eyebrow">A LITTLE COLOR MAGIC ✨</span>
      <h1>Theme Shop 🎨</h1>
      <p>Give your diary a fresh new look with cozy color palettes!</p>
    </header>

    <section class="themes-content">
      <div class="themes-section-heading">
        <h2>Available Themes</h2>
        <p>Purchase a theme or switch to one you've already unlocked.</p>
      </div>

      <div id="themeGrid" class="theme-grid">
        <!-- Theme cards will be added using JavaScript -->
      </div>
    </section>
  </main>

<script src="theme.js"></script>
<script src="themes.js"></script>
</body>
</html>
